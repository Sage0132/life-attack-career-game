<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="從生涯卡出發，探索在乎的事、好奇的工作與下一個體驗任務。"><title>生涯特攻隊｜我的探索任務</title><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=20261019-v2"><link rel="stylesheet" href="revision.css?v=20261019-v2"></head><body><div class="noise" aria-hidden="true"></div><div class="app-shell"><header class="topbar"><div class="brand-block"><span class="kicker">CAREER EXPLORER / 02</span><h1>生涯特攻隊</h1><p class="subtitle">選出在乎的事，找到下一個想試的任務。</p></div><div class="mission-meta"><label class="field-chip"><span>隊員暱稱</span><input id="studentName" maxlength="40" placeholder="可以先不填" autocomplete="off"></label><button class="secondary-action" id="resetBtn">開始新一份</button></div></header><div class="privacy-note">進度只存在這台裝置的瀏覽器。共用電腦換人操作時，請按「開始新一份」；已保留紀錄可從「探索歷程」載入。<span id="saveStatus" role="status"></span></div><nav class="stage-nav" aria-label="探索步驟"><button class="stage-pill" data-stage="home">任務基地</button><button class="stage-pill" data-stage="values">01 在乎的事</button><button class="stage-pill" data-stage="jobs">02 想認識的工作</button><button class="stage-pill" data-stage="plan">03 整理與行動</button><button class="stage-pill" data-stage="report">探索報告</button></nav><p class="edit-guide"><strong>想修改答案？</strong>直接點上方步驟返回，原本答案會保留。隔幾個月想換方向，請到「探索歷程」保留上次、開始本次探索。</p><main id="main" tabindex="-1"></main><footer class="app-footer">這份報告記錄本次選擇，供學生與老師討論；價值偏好不代表能力，職業志願可以隨體驗改變。</footer></div><dialog id="resetDialog"><h2>換一位隊員，重新探索？</h2><p>目前作答會先保留到探索歷程，再建立空白作答。若是同一位學生隔一段時間再探索，請改用探索歷程中的「保留上次」按鈕。</p><div class="action-row"><button class="secondary-action" id="cancelReset">先保留</button><button class="primary-action" id="confirmReset">保留目前並開始新一份</button></div></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><
